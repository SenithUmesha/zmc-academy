name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Verify repository hygiene
        shell: pwsh
        run: |
          $tracked = git ls-files
          $forbidden = $tracked | Where-Object {
            $_ -match '(^|/)(bin|obj|\.vs)/' -or
            $_ -match '\.(mdf|ldf)$' -or
            $_ -match '\.csproj\.user$'
          }

          if ($forbidden) {
            $forbidden | ForEach-Object { Write-Error "Generated/local artifact is tracked: $_" }
            exit 1
          }

      - name: Build
        shell: pwsh
        run: msbuild "WF CW2 TEST.sln" /t:Restore,Build /p:Configuration=Release /p:Platform="Any CPU" /m

      - name: Verify output
        shell: pwsh
        run: |
          if (-not (Test-Path "WF CW2 TEST/bin/Release/WF CW2 TEST.exe")) {
            throw "Expected WinForms executable was not produced."
          }
